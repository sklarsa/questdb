steps:
  - label: ":handshake: compat (cache pilot)"
    key: compat-cache
    agents:
      queue: linux-medium
    # Native Buildkite hosted cache (hosted_container_cache_enabled=True), NOT
    # the community cache-buildkite-plugin - that plugin uses a local
    # /var/cache/buildkite folder which does not exist on ephemeral hosted
    # agents, so its post-command save errored and failed the build even though
    # the tests passed.
    cache:
      paths:
        - "~/.m2/repository"
      name: "maven"
    command: |
      PRELUDE_NEED_CLIENT=1 source .buildkite/prelude.sh
      du -sh ~/.m2/repository 2>/dev/null || echo "m2 empty (cold)"
      echo "--- compat + cliutil tests"
      mvn $MVN_COMMON clean test -Dtest.include='**/compat/**,**/cliutil/**' -Dout=$(pwd)/ci/qlog.conf
