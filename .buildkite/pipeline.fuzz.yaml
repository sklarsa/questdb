# Scheduled fuzz run. Mirrors Azure ci/test-fuzz.yml, which runs on a cron
# (every 15 min on master) rather than per-PR. Runs the Fuzz-matching test
# classes across the full reactor on a large Linux agent.
#
# This is a SEPARATE pipeline from the per-PR one: point a dedicated Buildkite
# pipeline (e.g. questdb-fuzz) at this file and attach a schedule to it (the
# schedule is a pipeline setting, configured via the REST API / UI, not in this
# YAML). See .buildkite/README or the workflow-port design doc for the cronline.
#
# Use the surefire regex via the -Dtest.include PROPERTY (the pom wires it into
# the plugin's <include>), exactly like the griffin/cairo legs and Azure's
# includeTests: %regex[.*Fuzz.*class]. Do NOT use the -Dtest command-line
# SELECTOR: it makes surefire treat the pattern as "specified tests", and the
# benchmarks module (0 tests, ancient surefire 2.17) then fails the whole
# reactor with "No tests were executed!" - which is exactly what sank fuzz
# build #1 even though all 685 matched *Fuzz* tests passed.
steps:
  - label: ":game_die: fuzz"
    key: fuzz
    agents:
      queue: linux-large
    artifact_paths:
      - "core/target/surefire-reports/**/*.xml"
    command: |
      source .buildkite/prelude.sh
      echo "--- fuzz test classes (full reactor)"
      mvn $MVN_COMMON clean test -Dtest.include='%regex[.*Fuzz.*class]' -Dout=$(pwd)/ci/qlog.conf
