# Buildkite Linux x86 smoke test for QuestDB core.
# Static pipeline on hosted agents running the custom image
# (.buildkite/Dockerfile), which bakes in JDK 25 + Maven + Rust.
# See docs/superpowers/specs/2026-07-29-buildkite-linux-smoke-test-design.md
steps:
  - label: ":lint-roller: lint"
    key: lint
    agents:
      queue: linux-small
    command: |
      # Notes on this agent's shell, learned the hard way while getting the
      # bytecode check green (see the check itself below):
      #  - a plain shell variable set on one line can read back empty on the
      #    next, so keep JAR_FILE and its use on a single line;
      #  - `find core/target ... ! -name '*-tests.jar'` returned nothing even
      #    though a plain glob listed the JARs, so the check uses a glob, not
      #    find;
      #  - $MVN_COMMON survives across lines only because prelude.sh exports it.
      source .buildkite/prelude.sh
      echo "--- unterminated log check"
      python3 find_unterminated_logs.py core/src --exclude=LogParanoiaTest.java
      echo "--- rust fmt + clippy"
      # Flat per-crate commands (no shell loop variable) - mirrors Azure
      # rust-test-and-lint.yml. A `for crate in ...` loop expanded to an empty
      # $crate under Buildkite's command wrapper, landing in core/rust (which
      # has no Cargo.toml) and failing cargo fmt.
      ( cd core/rust/qdb-core         && cargo fmt --check && cargo clippy --all-targets --all-features -- -D warnings )
      ( cd core/rust/qdb-parquet-meta && cargo fmt --check && cargo clippy --all-targets --all-features -- -D warnings )
      ( cd core/rust/qdbr             && cargo fmt --check && cargo clippy --all-targets --all-features -- -D warnings )
      echo "--- compile core (needed for bytecode check)"
      mvn $MVN_COMMON -pl core -am -DskipTests package
      echo "--- bytecode size check"
      # Pass the directory and let check-bytecode-size.sh discover the JAR. The
      # `*` glob to skip the tests/sources/javadoc JARs must run inside the
      # script's real shell: Buildkite's inline command wrapper eats `*` in a
      # pipeline command block, so both a bare glob and `find -name 'questdb-*'`
      # came back empty here even though `ls core/target` listed the JARs.
      ./ci/check-bytecode-size.sh --jar-dir core/target --threshold 8000

  - label: ":coffee: test: griffin"
    key: test-griffin
    agents:
      queue: linux-large
    artifact_paths:
      - "core/target/surefire-reports/**/*.xml"
    command: |
      source .buildkite/prelude.sh
      mvn $MVN_COMMON clean test -Dtest.include='**/griffin/**'

  - label: ":coffee: test: cairo"
    key: test-cairo
    agents:
      queue: linux-large
    artifact_paths:
      - "core/target/surefire-reports/**/*.xml"
    command: |
      source .buildkite/prelude.sh
      mvn $MVN_COMMON clean test -Dtest.include='**/cairo/**'

  - label: ":coffee: test: other"
    key: test-other
    agents:
      queue: linux-medium
    artifact_paths:
      - "core/target/surefire-reports/**/*.xml"
    command: |
      source .buildkite/prelude.sh
      mvn $MVN_COMMON clean test \
        -Dtest.exclude='**/griffin/**,**/cairo/**,**/compat/**,**/cliutil/**,**/ServerMainTest.java'

  - label: ":bar_chart: coverage (proof-of-path)"
    key: coverage
    agents:
      queue: linux-medium
    # The JaCoCo HTML report emits one file per class - thousands of small
    # files, well over Buildkite's hard limit of 5000 artifacts per job.
    # Compress the whole report tree into a single archive before upload so
    # it counts as one artifact. Uses the official artifacts plugin's
    # `compressed` option. Note: globs (* / **) do NOT work with `compressed`
    # - `upload` must name the directory/file itself, which the plugin archives
    # recursively into one file.
    #
    # Archive as .tgz, not .zip: the plugin shells out to `zip` for a .zip
    # name, which is absent on plain hosted agents (only baked into the custom
    # image). `.tgz` uses tar, which is always present, so the upload works
    # whether or not the custom image is active.
    plugins:
      - artifacts#v1.9.4:
          upload:
            - "core/target/site/jacoco"
            - "core/target/jacoco.exec"
          compressed: jacoco-report.tgz
    command: |
      source .buildkite/prelude.sh
      echo "--- pre-build core so coverage run has deps"
      mvn $MVN_COMMON -pl core -am -DskipTests install
      echo "--- instrumented test slice (std package) with jacoco"
      mvn $MVN_COMMON -f core/pom.xml test \
        -P jacoco,qdbr-coverage \
        -Dtest.include='**/std/**'
      echo "--- jacoco report"
      mvn $MVN_COMMON -f core/pom.xml jacoco:report || true
