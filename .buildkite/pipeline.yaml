# Buildkite Linux x86 smoke test for QuestDB core.
# Static pipeline on hosted agents running the custom image
# (.buildkite/Dockerfile), which bakes in JDK 25 + Maven + Rust.
# See docs/superpowers/specs/2026-07-29-buildkite-linux-smoke-test-design.md
steps:
  - label: ":lint-roller: lint"
    key: lint
    agents:
      queue: linux-small
    cache:
      paths:
        - "~/.m2/repository"
      name: "maven"
    command: |
      # Notes on this agent's shell, learned the hard way while getting the
      # bytecode check green (see the check itself below):
      #  - a plain shell variable set on one line can read back empty on the
      #    next, so keep JAR_FILE and its use on a single line;
      #  - `find core/target ... ! -name '*-tests.jar'` returned nothing even
      #    though a plain glob listed the JARs, so the check uses a glob, not
      #    find;
      #  - $MVN_COMMON survives across lines only because prelude.sh exports it.
      PRELUDE_NEED_RUST=1 PRELUDE_NEED_CLIENT=1 source .buildkite/prelude.sh
      echo "--- unterminated log check"
      python3 find_unterminated_logs.py core/src --exclude=LogParanoiaTest.java
      echo "--- rust fmt + clippy"
      # Flat per-crate commands (no shell loop variable) - mirrors Azure
      # rust-test-and-lint.yml. A `for crate in ...` loop expanded to an empty
      # $crate under Buildkite's command wrapper, landing in core/rust (which
      # has no Cargo.toml) and failing cargo fmt.
      ( cd core/rust/qdb-core         && cargo fmt --check && cargo clippy --all-targets --all-features -- -D warnings )
      ( cd core/rust/qdb-parquet-meta && cargo fmt --check && cargo clippy --all-targets --all-features -- -D warnings )
      ( cd core/rust/qdbr             && cargo fmt --check && cargo clippy --all-targets --all-features -- -D warnings )
      echo "--- compile core (needed for bytecode check)"
      mvn $MVN_COMMON -pl core -am -DskipTests package
      echo "--- bytecode size check"
      # Pass the directory and let check-bytecode-size.sh discover the JAR. The
      # `*` glob to skip the tests/sources/javadoc JARs must run inside the
      # script's real shell: Buildkite's inline command wrapper eats `*` in a
      # pipeline command block, so both a bare glob and `find -name 'questdb-*'`
      # came back empty here even though `ls core/target` listed the JARs.
      ./ci/check-bytecode-size.sh --jar-dir core/target --threshold 8000

  # Functional test legs run on BOTH arches via a matrix over `arch`:
  #   ""     -> x86  : queue linux-large,     prelude.sh
  #   "-arm" -> arm64: queue linux-arm-large, linux-arm-prelude.sh
  # {{matrix.arch}} interpolates in agents.queue and command (validated by the
  # questdb-matrix-probe pipeline: each leg asserted uname -m matched its arch).
  # `key` does NOT support matrix interpolation, so these matrixed legs carry no
  # explicit key (Buildkite auto-suffixes per combo); nothing depends_on them.
  # The arm functional legs need only PRELUDE_NEED_CLIENT (not _RUST): a plain
  # `mvn test` does not run the qdbr rust-maven-plugin build - only the
  # qdbr-coverage profile does - so this matches the x86 flags exactly.
  - label: ":coffee: test: griffin{{matrix.arch}}"
    agents:
      queue: "linux{{matrix.arch}}-large"
    matrix:
      setup:
        arch:
          - ""
          - "-arm"
    cache:
      paths:
        - "~/.m2/repository"
      name: "maven"
    artifact_paths:
      - "core/target/surefire-reports/**/*.xml"
    command: |
      if [ "{{matrix.arch}}" = "-arm" ]; then PRELUDE=.buildkite/linux-arm-prelude.sh; else PRELUDE=.buildkite/prelude.sh; fi
      PRELUDE_NEED_CLIENT=1 source "$PRELUDE"
      mvn $MVN_COMMON clean test -Dtest.include='**/griffin/**'

  - label: ":coffee: test: cairo{{matrix.arch}}"
    agents:
      queue: "linux{{matrix.arch}}-large"
    matrix:
      setup:
        arch:
          - ""
          - "-arm"
    cache:
      paths:
        - "~/.m2/repository"
      name: "maven"
    artifact_paths:
      - "core/target/surefire-reports/**/*.xml"
    command: |
      if [ "{{matrix.arch}}" = "-arm" ]; then PRELUDE=.buildkite/linux-arm-prelude.sh; else PRELUDE=.buildkite/prelude.sh; fi
      PRELUDE_NEED_CLIENT=1 source "$PRELUDE"
      mvn $MVN_COMMON clean test -Dtest.include='**/cairo/**'

  - label: ":coffee: test: other{{matrix.arch}}"
    agents:
      queue: "linux{{matrix.arch}}-medium"
    matrix:
      setup:
        arch:
          - ""
          - "-arm"
    cache:
      paths:
        - "~/.m2/repository"
      name: "maven"
    artifact_paths:
      - "core/target/surefire-reports/**/*.xml"
    command: |
      if [ "{{matrix.arch}}" = "-arm" ]; then PRELUDE=.buildkite/linux-arm-prelude.sh; else PRELUDE=.buildkite/prelude.sh; fi
      PRELUDE_NEED_CLIENT=1 source "$PRELUDE"
      mvn $MVN_COMMON clean test \
        -Dtest.exclude='**/griffin/**,**/cairo/**,**/compat/**,**/cliutil/**,**/ServerMainTest.java'

  - label: ":bar_chart: coverage (proof-of-path)"
    key: coverage
    agents:
      queue: linux-medium
    cache:
      paths:
        - "~/.m2/repository"
      name: "maven"
    # The JaCoCo HTML report emits one file per class - thousands of small
    # files, well over Buildkite's hard limit of 5000 artifacts per job.
    # Compress the whole report tree into a single archive before upload so
    # it counts as one artifact. Uses the official artifacts plugin's
    # `compressed` option. Note: globs (* / **) do NOT work with `compressed`
    # - `upload` must name the directory/file itself, which the plugin archives
    # recursively into one file.
    #
    # Archive as .tgz, not .zip: the plugin shells out to `zip` for a .zip
    # name, which is absent on plain hosted agents (only baked into the custom
    # image). `.tgz` uses tar, which is always present, so the upload works
    # whether or not the custom image is active.
    plugins:
      - artifacts#v1.9.4:
          upload:
            - "core/target/site/jacoco"
            - "core/target/jacoco.exec"
          compressed: jacoco-report.tgz
    # Also upload the raw jacoco.exec UNCOMPRESSED (one small file, no HTML), so
    # the coverage-merge leg can `artifact download **/jacoco.exec` without
    # unpacking the HTML tgz. The compressed tgz above bundles the exec together
    # with the thousands of HTML files, which is not individually downloadable.
    artifact_paths:
      - "core/target/jacoco.exec"
    command: |
      PRELUDE_NEED_CLIENT=1 source .buildkite/prelude.sh
      echo "--- pre-build core so coverage run has deps"
      mvn $MVN_COMMON -pl core -am -DskipTests install
      echo "--- instrumented test slice (std package) with jacoco"
      mvn $MVN_COMMON -f core/pom.xml test \
        -P jacoco,qdbr-coverage \
        -Dtest.include='**/std/**'
      echo "--- jacoco report"
      mvn $MVN_COMMON -f core/pom.xml jacoco:report || true

  - label: ":art: format (intellij)"
    key: format
    agents:
      queue: linux-medium
    command: |
      source .buildkite/prelude.sh
      # Use a RELATIVE dir (.ci/intellij) with no cross-line shell variable: a
      # plain var set on one line reads back empty on the next in Buildkite's
      # command wrapper (the same gotcha the lint step documents), which made an
      # earlier IDEA_ROOT="$PWD/..." / "$(pwd)/..." expand to empty and
      # `mkdir ''` fail. Relative paths resolve fine since the step's cwd is the
      # repo checkout and stays put.
      echo "--- download pinned IntelliJ (2GB; hosted agents have no persistent tool cache)"
      rm -rf .ci/intellij && mkdir -p .ci/intellij
      curl -fsSL "https://download.jetbrains.com/idea/idea-2026.1.4.tar.gz" -o intellij.tar.gz
      tar xzf intellij.tar.gz -C .ci/intellij && rm intellij.tar.gz
      ( cd .ci/intellij && ln -s idea-* idea )
      echo "--- apply formatting in place"
      ./.ci/intellij/idea/bin/idea.sh format -s .idea/codeStyles/Project.xml -m "*.java" -r .
      echo "--- reset submodules the formatter may have touched"
      git submodule foreach --quiet 'git checkout -- . 2>/dev/null; git clean -fd 2>/dev/null' || true
      echo "--- fail if the formatter changed anything"
      git status -s
      git diff --exit-code

  - label: ":memo: javadoc"
    key: javadoc
    agents:
      queue: linux-medium
    cache:
      paths:
        - "~/.m2/repository"
      name: "maven"
    command: |
      PRELUDE_NEED_CLIENT=1 source .buildkite/prelude.sh
      echo "--- javadoc"
      mvn $MVN_COMMON compile javadoc:javadoc -DskipTests -P javadoc -P qdbr-release

  - label: ":docker: docker build (no push)"
    key: docker-build
    agents:
      queue: linux-large
    # Does NOT source prelude.sh: core/Dockerfile builds the whole toolchain
    # in-container, so the host only needs docker (present, backed by a
    # remote:nsc-remote builder) + the client submodule for the local-client
    # build context. Builds only - never pushes, no registry login.
    command: |
      set -euo pipefail
      echo "--- docker availability probe"
      docker version
      docker buildx version || echo "buildx not present (plain docker build is fine)"
      echo "--- init client submodule (local-client build context)"
      git submodule update --init --recursive java-questdb-client
      echo "--- build questdb image (native arch, no push)"
      docker build -f core/Dockerfile --target questdb -t questdb-ci:local .
      echo "--- build rhel image (native arch, no push)"
      docker build -f core/Dockerfile --target rhel -t questdb-ci:local-rhel .

  - label: ":apple: test: griffin (macos)"
    key: test-griffin-macos
    agents:
      queue: macos-large
    artifact_paths:
      - "core/target/surefire-reports/**/*.xml"
    command: |
      source .buildkite/macos-prelude.sh
      mvn $MVN_COMMON clean test -Dtest.include='**/griffin/**'

  - label: ":bar_chart: coverage (jemalloc)"
    key: coverage-jemalloc
    agents:
      # linux-large: instrumented runs under jemalloc need the headroom, and it
      # keeps this leg well clear of the ~50min hosted-agent job cap.
      queue: linux-large
    cache:
      paths:
        - "~/.m2/repository"
      name: "maven"
    command: |
      PRELUDE_NEED_CLIENT=1 source .buildkite/prelude.sh
      # jemalloc via LD_PRELOAD, mirroring Azure steps.yml "Run tests with
      # Coverage (jemalloc)". The whole 10-build jemalloc saga chased an
      # apt-installed libjemalloc2 and then failed to LOCATE it at runtime - but
      # Azure never installs one: it LD_PRELOADs the libjemalloc.so COMMITTED in
      # the repo at core/src/main/bin/linux-x86-64/libjemalloc.so. That file is
      # always in the checkout, so there is nothing to discover: no apt, no
      # ldconfig, no find.
      #
      # CRITICAL wrapper quirk (measured on build #1 of questdb-jemalloc-deferred):
      # this command wrapper PRE-EXPANDS a bare $VAR reference at trace time,
      # BEFORE the line runs - so `export LD_PRELOAD=...; test -f "$LD_PRELOAD"`
      # saw an EMPTY $LD_PRELOAD even though the export is on the SAME line (the
      # trace showed `test -f ""`, and the guard fired with an empty path). The
      # fix: NEVER read a $VAR we just set. Recompute the path inline with $(pwd)
      # (command substitution IS preserved by the wrapper and runs at runtime),
      # and set LD_PRELOAD as an inline command-PREFIX on the very process that
      # needs it - set-and-use in one spawn, no cross-reference.
      echo "--- verify jemalloc is present and actually preloads (fail if not)"
      test -f "$(pwd)/core/src/main/bin/linux-x86-64/libjemalloc.so" || { echo "FATAL: committed libjemalloc.so missing in checkout"; exit 1; }
      LD_PRELOAD="$(pwd)/core/src/main/bin/linux-x86-64/libjemalloc.so" bash -c 'grep -q jemalloc /proc/self/maps && echo "jemalloc preloaded OK: $(grep -c jemalloc /proc/self/maps) mappings" || { echo "FATAL: jemalloc did NOT preload (not in /proc/self/maps)"; exit 1; }'
      echo "--- pre-build core so the instrumented run has deps"
      mvn $MVN_COMMON -pl core -am -DskipTests install
      echo "--- instrumented test slice (std package) with jacoco, under jemalloc"
      LD_PRELOAD="$(pwd)/core/src/main/bin/linux-x86-64/libjemalloc.so" mvn $MVN_COMMON -f core/pom.xml test \
        -P jacoco,qdbr-coverage \
        -Dtest.include='**/std/**' \
        -Dout=$(pwd)/ci/qlog.conf
      echo "--- jacoco report"
      mvn $MVN_COMMON -f core/pom.xml jacoco:report || true

  - label: ":crab: rust coverage (cargo test)"
    key: rust-coverage
    agents:
      queue: linux-medium
    # Four instrumented cargo-test suites (qdb-core, qdb-parquet-meta, qdbr,
    # parquet2) under LLVM source-based coverage, mirroring Azure
    # rust-test-and-lint.yml. Uploads one LCOV per crate for the coverage-report
    # merge. Rust-only (no client, no JVM tests), so PRELUDE_NEED_RUST=1 and no
    # PRELUDE_NEED_CLIENT. The heavy lifting lives in rust-coverage.sh because
    # Buildkite's command wrapper pre-expands bare $VARs at trace time (empties
    # cross-line vars); inside a sourced script ordinary shell semantics hold.
    artifact_paths:
      - "rust-lint-profraw/*.lcov"
      - "rust-lint-profraw/*.profdata"
    command: |
      PRELUDE_NEED_RUST=1 source .buildkite/prelude.sh
      bash .buildkite/rust-coverage.sh

  - label: ":heavy_plus_sign: coverage merge (no PR post)"
    key: coverage-merge
    agents:
      queue: linux-medium
    cache:
      paths:
        - "~/.m2/repository"
      name: "maven"
    # Merges the partial coverage the upstream legs uploaded: the JaCoCo
    # jacoco.exec into one jacoco.xml, and the per-crate Rust LCOV into one
    # cobertura.xml (Azure's CoverageReports merge). depends_on gates it behind
    # the producers; allow_dependency_failure so a single flaky coverage leg
    # does not starve the merge of the other's inputs. This leg STOPS before
    # Azure's cover-checker GitHub PR post - no --github-token, no --pr, no
    # external side effect. Needs the client for the JaCoCo report's compiled
    # classes (PRELUDE_NEED_CLIENT=1).
    depends_on:
      - coverage
      - rust-coverage
    allow_dependency_failure: true
    artifact_paths:
      - "coverage-merged/*.xml"
    command: |
      PRELUDE_NEED_CLIENT=1 source .buildkite/prelude.sh
      bash .buildkite/coverage-merge.sh

  - label: ":handshake: compat"
    key: compat
    agents:
      queue: linux-medium
    artifact_paths:
      - "compat/target/surefire-reports/**/*.xml"
      - "core/target/surefire-reports/**/*.xml"
    # Native Buildkite hosted cache for the Maven local repo. compat pulls the
    # heaviest deps (hadoop/parquet/influxdb) - ~589 "Downloading from central"
    # cold. NOT the community cache plugin: that uses /var/cache/buildkite which
    # does not exist on ephemeral hosted agents (its save hook fails the build).
    cache:
      paths:
        - "~/.m2/repository"
      name: "maven"
    command: |
      PRELUDE_NEED_CLIENT=1 source .buildkite/prelude.sh
      echo "--- compat + cliutil tests"
      mvn $MVN_COMMON clean test \
        -Dtest.include='**/compat/**,**/cliutil/**' \
        -Dout=$(pwd)/ci/qlog.conf
