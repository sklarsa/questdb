# Throwaway: ONE heavy coverage shard (cairo-root) on linux-large, to test
# whether the bigger/faster agent (8 vCPU/32GB vs medium 4/16) completes the
# instrumented run within the ~50min hosted-agent job cap that killed it on
# linux-medium.
steps:
  - label: ":bar_chart: cov cairo-root (large)"
    key: cov-cairo-root
    agents:
      queue: linux-large
    artifact_paths:
      - "core/target/jacoco-cairo-root.exec"
    command: |
      source .buildkite/prelude.sh
      echo "--- pre-build core"
      mvn $MVN_COMMON -pl core -am -DskipTests install
      echo "--- cairo-root instrumented (cairo/* minus O3/Fuzz)"
      mvn $MVN_COMMON -f core/pom.xml test -P jacoco,qdbr-coverage \
        -Dtest.include='**/cairo/*' -Dtest.exclude='**/O3*Test**,**/**Fuzz**'
      cp core/target/jacoco.exec core/target/jacoco-cairo-root.exec
