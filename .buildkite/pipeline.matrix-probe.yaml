# THROWAWAY probe: validate BOTH (1) {{matrix.arch}} routes agents.queue to the
# right arch, and (2) the inline prelude-select `source "$(...)"` idiom resolves
# to a real file under Buildkite's command wrapper (build #60 proved a $PRELUDE
# var set on one line reads back EMPTY on the next -> `source ""`; this probe
# guards the one-line command-substitution fix before it hits the 40-min run).
#
# arch: "" -> x86 (linux-large, prelude.sh); "-arm" -> arm64 (linux-arm-large,
# linux-arm-prelude.sh). We do NOT actually source (that pulls the whole
# toolchain); we assert the substitution picks the correct EXISTING file.
steps:
  - label: ":test_tube: probe {{matrix.arch}}"
    matrix:
      setup:
        arch:
          - ""
          - "-arm"
    agents:
      queue: "linux{{matrix.arch}}-large"
    command: |
      set -euo pipefail
      echo "--- arch check: matrix='{{matrix.arch}}' uname=$(uname -m)"
      # The exact idiom the real legs use, minus the actual source: resolve the
      # prelude path via command substitution on the interpolated matrix value.
      PRELUDE="$([ '{{matrix.arch}}' = '-arm' ] && echo .buildkite/linux-arm-prelude.sh || echo .buildkite/prelude.sh)"
      echo "--- resolved PRELUDE=$PRELUDE"
      test -n "$PRELUDE" || { echo "FATAL: PRELUDE empty (the build #60 bug)"; exit 1; }
      test -f "$PRELUDE" || { echo "FATAL: PRELUDE '$PRELUDE' is not a file"; exit 1; }
      # Cross-check the right file for the arch.
      if [ "$(uname -m)" = "aarch64" ]; then EXPECT=.buildkite/linux-arm-prelude.sh; else EXPECT=.buildkite/prelude.sh; fi
      [ "$PRELUDE" = "$EXPECT" ] || { echo "FATAL: arch $(uname -m) resolved wrong prelude ($PRELUDE, expected $EXPECT)"; exit 1; }
      # Prove the exact `PRELUDE_NEED_CLIENT=1 source "$(...)"` line PARSES and the
      # substitution yields the file (source a trivial no-op marker instead of the
      # heavy prelude): run the real substitution and confirm it is sourceable.
      PRELUDE_NEED_CLIENT=1 source "$([ '{{matrix.arch}}' = '-arm' ] && echo /dev/null || echo /dev/null)"
      echo "--- OK: $(uname -m) -> $PRELUDE (inline source idiom resolves + sources)"
