# THROWAWAY probe: validate BOTH (1) {{matrix.arch}} routes agents.queue to the
# right arch, and (2) the inline prelude-select `source "$(...)"` idiom resolves
# to a real file under Buildkite's command wrapper (build #60 proved a $PRELUDE
# var set on one line reads back EMPTY on the next -> `source ""`; this probe
# guards the one-line command-substitution fix before it hits the 40-min run).
#
# arch: "" -> x86 (linux-large, prelude.sh); "-arm" -> arm64 (linux-arm-large,
# linux-arm-prelude.sh). We do NOT actually source (that pulls the whole
# toolchain); we assert the substitution picks the correct EXISTING file.
steps:
  - label: ":test_tube: probe {{matrix.arch}}"
    matrix:
      setup:
        arch:
          - ""
          - "-arm"
    agents:
      queue: "linux{{matrix.arch}}-large"
    command: |
      set -euo pipefail
      echo "--- arch check: matrix='{{matrix.arch}}' uname=$(uname -m)"
      # Assert the INLINE idiom the real legs use: the command substitution is on
      # the SAME line as its use, with NO $PRELUDE var read on a later line. (An
      # earlier version of this probe assigned PRELUDE=$(...) then tested it on
      # the next line - which reintroduced the very cross-line-var bug it was
      # meant to guard, a false negative. The real legs never do that.)
      # Echo the resolved path inline so the substitution's result is visible:
      echo "--- resolved inline: $([ '{{matrix.arch}}' = '-arm' ] && echo .buildkite/linux-arm-prelude.sh || echo .buildkite/prelude.sh)"
      # Assert the file exists AND matches the arch, all inline (same-line subs):
      test -f "$([ '{{matrix.arch}}' = '-arm' ] && echo .buildkite/linux-arm-prelude.sh || echo .buildkite/prelude.sh)" || { echo "FATAL: resolved prelude is not a file"; exit 1; }
      test "$(uname -m)" = "$([ '{{matrix.arch}}' = '-arm' ] && echo aarch64 || echo x86_64)" || { echo "FATAL: matrix.arch routed to wrong machine"; exit 1; }
      # Prove the exact `PRELUDE_NEED_CLIENT=1 source "$(...)"` line parses+sources
      # (source /dev/null as a cheap no-op stand-in for the heavy prelude):
      PRELUDE_NEED_CLIENT=1 source "$([ '{{matrix.arch}}' = '-arm' ] && echo /dev/null || echo /dev/null)"
      echo "--- OK: $(uname -m) inline source idiom resolves + sources correctly"
