# Throwaway: the 8-way coverage matrix + merge, for fast isolated verification.
# Mirrors Azure self-hosted-cover-jobs.yml's shard split (griffin-root/sub,
# fuzz1/2, cairo-root/sub, pgwire, other), each instrumented with
# -P jacoco,qdbr-coverage, under the jemalloc allocator (LD_PRELOAD of the
# repo-committed core/src/main/bin/linux-x86-64/libjemalloc.so) - exactly like
# Azure steps.yml "Run tests with Coverage (jemalloc)".
#
# Each shard copies its jacoco.exec to a per-shard name and uploads it; the
# merge step downloads them all and produces one combined report.
steps:
  - group: ":bar_chart: coverage matrix"
    steps:
      - label: ":bar_chart: cov {{matrix}}"
        key: "coverage"
        agents:
          # linux-large, NOT medium: on medium (4 vCPU/16GB) the instrumented
          # cairo/fuzz/pgwire shards crawled and hit the ~50min hosted-agent job
          # cap. On large (8 vCPU/32GB) cairo-root ran in 8.7min (proven by the
          # covone test) - a 5-6x speedup, comfortably under the cap.
          queue: linux-large
        matrix:
          - "griffin-root"
          - "griffin-sub"
          - "fuzz1"
          - "fuzz2"
          - "cairo-root"
          - "cairo-sub"
          - "pgwire"
          - "other"
        # Upload via a STATIC glob, not "jacoco-{{matrix}}.exec": Buildkite does
        # NOT interpolate {{matrix}} inside artifact_paths (it does in command/
        # label/key), so the literal "core/target/jacoco-{{matrix}}.exec" matched
        # no file and every shard uploaded nothing - the merge then found zero
        # execs and failed even though all 8 shards were green (proven on build
        # #3: "No files matched paths: core/target/jacoco-{{matrix}}.exec", then
        # the merge's "no artifacts found for downloading"). The cp in command
        # DOES expand {{matrix}}, so each shard leaves exactly one
        # jacoco-<shard>.exec; the glob below matches that one file (and not the
        # un-suffixed jacoco.exec, which has no dash).
        artifact_paths:
          - "core/target/jacoco-*.exec"
        command: |
          PRELUDE_NEED_CLIENT=1 source .buildkite/prelude.sh
          # jemalloc via LD_PRELOAD of the repo-committed libjemalloc.so (no apt,
          # no runtime discovery - the file is always in the checkout). This
          # wrapper PRE-EXPANDS a bare $VAR at trace time before the line runs,
          # so a just-set $LD_PRELOAD reads back EMPTY on its own line (proven on
          # questdb-jemalloc-deferred build #1). So NEVER read a var we set:
          # recompute the path inline with $(pwd) and set LD_PRELOAD as an inline
          # command-PREFIX on the process that needs it. Fail the shard if it did
          # not map, so no shard silently runs on the system allocator.
          test -f "$(pwd)/core/src/main/bin/linux-x86-64/libjemalloc.so" || { echo "FATAL: committed libjemalloc.so missing in checkout"; exit 1; }
          LD_PRELOAD="$(pwd)/core/src/main/bin/linux-x86-64/libjemalloc.so" bash -c 'grep -q jemalloc /proc/self/maps && echo "jemalloc preloaded OK: $(grep -c jemalloc /proc/self/maps) mappings" || { echo "FATAL: jemalloc did NOT preload"; exit 1; }'
          echo "--- pre-build core so the instrumented run has deps"
          mvn $MVN_COMMON -pl core -am -DskipTests install
          # Per-shard include/exclude, copied verbatim from Azure
          # self-hosted-cover-jobs.yml. CRITICAL: the whole mvn command - profiles,
          # LD_PRELOAD prefix, AND the -Dtest.include/-Dtest.exclude literals - must
          # live on ONE physical line PER SHARD. An earlier version set INC=/EXC=
          # in a `case` block and then read $INC/$EXC on a later `mvn` line; this
          # command wrapper pre-expands a bare $VAR at trace time BEFORE the line
          # runs, so $INC/$EXC read back EMPTY and every shard ran `-Dtest.include=""`
          # = the FULL 37934-test suite (proven on build #1: griffin-sub logged
          # "include=[] exclude=[]", ran all packages, took ~40min, and tripped the
          # flaky top-level ServerMainTest that its griffin pattern would have
          # excluded). Inlining the literals keeps set-and-use on one line, so the
          # filter actually takes effect. jem= holds only the LD_PRELOAD path and is
          # used on the SAME line it is set.
          echo "--- coverage shard {{matrix}} (patterns inlined per shard)"
          case "{{matrix}}" in \
            griffin-root) LD_PRELOAD="$(pwd)/core/src/main/bin/linux-x86-64/libjemalloc.so" mvn $MVN_COMMON -f core/pom.xml test -P jacoco,qdbr-coverage -Dtest.include="**/griffin/*" ;; \
            griffin-sub)  LD_PRELOAD="$(pwd)/core/src/main/bin/linux-x86-64/libjemalloc.so" mvn $MVN_COMMON -f core/pom.xml test -P jacoco,qdbr-coverage -Dtest.include="**/griffin/**/*" -Dtest.exclude="**/griffin/*" ;; \
            fuzz1)        LD_PRELOAD="$(pwd)/core/src/main/bin/linux-x86-64/libjemalloc.so" mvn $MVN_COMMON -f core/pom.xml test -P jacoco,qdbr-coverage -Dtest.include="**/cairo/fuzz/**" ;; \
            fuzz2)        LD_PRELOAD="$(pwd)/core/src/main/bin/linux-x86-64/libjemalloc.so" mvn $MVN_COMMON -f core/pom.xml test -P jacoco,qdbr-coverage -Dtest.include="**/O3*Test**,**/**Fuzz**" -Dtest.exclude="**/cairo/fuzz/**" ;; \
            cairo-root)   LD_PRELOAD="$(pwd)/core/src/main/bin/linux-x86-64/libjemalloc.so" mvn $MVN_COMMON -f core/pom.xml test -P jacoco,qdbr-coverage -Dtest.include="**/cairo/*" -Dtest.exclude="**/O3*Test**,**/**Fuzz**" ;; \
            cairo-sub)    LD_PRELOAD="$(pwd)/core/src/main/bin/linux-x86-64/libjemalloc.so" mvn $MVN_COMMON -f core/pom.xml test -P jacoco,qdbr-coverage -Dtest.include="**/cairo/**/*" -Dtest.exclude="**/cairo/*,**/O3*Test**,**/**Fuzz**" ;; \
            pgwire)       LD_PRELOAD="$(pwd)/core/src/main/bin/linux-x86-64/libjemalloc.so" mvn $MVN_COMMON -f core/pom.xml test -P jacoco,qdbr-coverage -Dtest.include="**/pgwire/**/*.java" ;; \
            other)        LD_PRELOAD="$(pwd)/core/src/main/bin/linux-x86-64/libjemalloc.so" mvn $MVN_COMMON -f core/pom.xml test -P jacoco,qdbr-coverage -Dtest.exclude="**/griffin/**,**/cairo/**,**/pgwire/**,**/ServerMainTest.java" ;; \
          esac
          cp core/target/jacoco.exec core/target/jacoco-{{matrix}}.exec

  - label: ":bar_chart: coverage merge"
    key: "coverage-merge"
    depends_on: "coverage"
    agents:
      queue: linux-medium
    plugins:
      - artifacts#v1.9.4:
          download: "core/target/jacoco-*.exec"
    command: |
      PRELUDE_NEED_CLIENT=1 source .buildkite/prelude.sh
      echo "--- downloaded per-shard exec files:"
      ls -la core/target/jacoco-*.exec || { echo "no exec files downloaded"; exit 1; }
      echo "--- build core classes so the report step has ../core/target/classes"
      mvn $MVN_COMMON -pl core -am -DskipTests install
      echo "--- merge exec files + build combined report (ci/jacoco-merge.xml)"
      # jacoco-merge.xml merges **/*.exec from -DincludeRoot then reports against
      # ../core/target/classes. Point includeRoot at core/target where the
      # downloaded jacoco-*.exec files landed.
      mvn $MVN_COMMON -f ci/jacoco-merge.xml verify -DincludeRoot=core/target
      echo "--- combined report at core/target/classes (fork eval: NOT posted to any PR)"
