# Throwaway: runs ONLY the jemalloc coverage leg for fast isolated verification.
# Not part of any real pipeline; uploaded by a temporary questdb-jemalloc-test pipeline.
steps:
  - label: ":pill: coverage (jemalloc LD_PRELOAD)"
    key: coverage-jemalloc
    agents:
      queue: linux-medium
    command: |
      source .buildkite/prelude.sh
      JEM=$(locate_jemalloc)
      echo "--- jemalloc path: ${JEM:-NONE}"
      test -n "$JEM" || { echo "libjemalloc not found"; exit 1; }
      echo "--- pre-build core so coverage run has deps"
      mvn $MVN_COMMON -pl core -am -DskipTests install
      echo "--- instrumented std slice under jemalloc LD_PRELOAD"
      LD_PRELOAD="$JEM" mvn $MVN_COMMON -f core/pom.xml test \
        -P jacoco,qdbr-coverage -Dtest.include='**/std/**'
