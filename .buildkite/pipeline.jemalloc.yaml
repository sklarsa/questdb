# Throwaway: runs ONLY the jemalloc coverage leg for fast isolated verification.
# Not part of any real pipeline; uploaded by a temporary questdb-jemalloc-test pipeline.
steps:
  - label: ":pill: coverage (jemalloc LD_PRELOAD)"
    key: coverage-jemalloc
    agents:
      queue: linux-medium
    command: |
      source .buildkite/prelude.sh
      # Install + resolve libjemalloc INLINE (not via a function in a command
      # substitution). Earlier attempts wrapped this in locate_jemalloc and
      # called it as JEM=$(locate_jemalloc) under the prelude's set -euo
      # pipefail; the install ran but the post-install lookup and even the
      # diagnostics produced no output, so JEM stayed empty. Doing it flat here,
      # with set +e around apt, removes that whole failure class.
      set +e
      # Show the agent's actual filesystem shape once - the hosted agent has
      # behaved differently from a local ubuntu:jammy container at every turn, so
      # stop guessing and print ground truth.
      echo "--- fs shape:"; ls -ld /usr/lib /lib 2>&1; ldconfig -p 2>/dev/null | grep -c libjemalloc
      # Resolve with plain `find /` (NO -L). This is EXACTLY the diagnostic that
      # reliably listed /usr/lib/x86_64-linux-gnu/libjemalloc.so.2 on the agent in
      # earlier runs, and unlike `find -L /` it does not follow symlinks so it
      # neither loops nor hangs. `-xdev` keeps it on the root filesystem for
      # speed. Everything narrower (ldconfig cache, find /usr/lib, an ls glob)
      # came back empty on this agent even though the file was present.
      resolve_jem() { find / -xdev -name 'libjemalloc.so.2' 2>/dev/null | head -1; }
      JEM=$(resolve_jem)
      if [ -z "$JEM" ]; then
        echo "--- installing libjemalloc2"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libjemalloc2
        sudo ldconfig
        JEM=$(resolve_jem)
      fi
      set -e
      echo "--- jemalloc path: ${JEM:-NONE}"
      if [ -z "$JEM" ]; then
        echo "libjemalloc not found; diagnostics:"
        dpkg -L libjemalloc2 2>&1 | grep -i jemalloc || true
        find / -name 'libjemalloc*' 2>/dev/null || true
        exit 1
      fi
      echo "--- pre-build core so coverage run has deps"
      mvn $MVN_COMMON -pl core -am -DskipTests install
      echo "--- instrumented std slice under jemalloc LD_PRELOAD"
      LD_PRELOAD="$JEM" mvn $MVN_COMMON -f core/pom.xml test \
        -P jacoco,qdbr-coverage -Dtest.include='**/std/**'
